name = "LeanWorm"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Worm13a"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.style.header = false
maxSynthPendingDepth = 3

# Lean proof of the lower bound 0.2410 for Moser's worm problem with rotations and translations only (M+).
# Toolchain leanprover/lean4:v4.35.0-rc3; Mathlib at tag v4.35.0-rc3 (commit c55e6e786f49, see lake-manifest.json).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

# Files from Ethan Keller's moser-worm-improved-bounds (Apache-2.0, commit 9a3394130fe4f7b1df6ffdeffda16601795d9ce4);
# see third_party/moser-worm-improved-bounds and PROVENANCE.md.
[[lean_lib]]
name = "MoserWorm"
globs = ["MoserWorm.LowerBound.+", "MoserWorm.Common.Box.+", "MoserWorm.Common.Area", "MoserWorm.Common.Defs",
  "MoserWorm.Common.Isometry", "MoserWorm.Common.Multiaffine", "MoserWorm.Common.Polyline",
  "MoserWorm.Common.Interval.Rational", "MoserWorm.Common.Interval.Sound"]

# The core-only interval layer of MoserWorm, used by the checker; precompiled so that `native_decide` runs native code.
# (The libraries must be disjoint: a module in two libraries makes `lake build <lib>` report a build cycle.)
[[lean_lib]]
name = "WormInterval"
roots = ["MoserWorm.Common.Interval.Basic", "MoserWorm.Common.Interval.RationalBasic"]
precompileModules = true

[[lean_lib]]
name = "Worm13a"
globs = ["Worm13a.+"]

# The certificate checker (core Lean plus Keller's dyadic interval layer), precompiled for `native_decide`.
[[lean_lib]]
name = "WormCore"
roots = ["WormCore.Check", "WormCore.Bound", "WormCore.Tree", "WormCore.Family"]
precompileModules = true

# Soundness of the checker (Mathlib).
[[lean_lib]]
name = "WormSound"
globs = ["WormSound.+"]

# Native-track shards (generated by tools/wshards.py).
[[lean_lib]]
name = "WormN"
globs = ["WormN.+"]

[[lean_exe]]
name = "wormchunk"
root = "WormCore.ChunkMain"
